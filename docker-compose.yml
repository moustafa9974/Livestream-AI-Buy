# Local dev services. Free and open source.
# Elasticsearch is added in Phase 4.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: seen
      POSTGRES_PASSWORD: seen
      POSTGRES_DB: seen
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seen"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
